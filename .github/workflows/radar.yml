name: GemRadar scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - "*.py"
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: gemradar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certificate bundle
        run: python -m pip install -r requirements.txt

      - name: Restore watch pool
        uses: actions/cache@v4
        with:
          path: cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-

      - name: Scan for new tokens
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          DASHBOARD_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          RUN_SECONDS: "660"
          CYCLE_SECONDS: "90"
        run: python radar.py

      - name: Save state
        run: |
          git config user.name "gemradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -q -m "New GemRadar alert"
          git pull --rebase --autostash -q || true
          git push -q || echo "state push skipped"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        uses: actions/github-script@v7
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.scan.outputs.artifact_id }}
        with:
          script: |
            const expected = process.env.EXPECTED_ARTIFACT_ID;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 }
              );
              if (artifacts.some(a => String(a.id) === expected && a.name === 'github-pages' && !a.expired)) return;
              core.info(`Waiting for artifact (${attempt}/12)`);
              await new Promise(r => setTimeout(r, 5000));
            }
            throw new Error('Pages artifact not visible yet; the next run will publish.');
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
